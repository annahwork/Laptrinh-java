<section id="campaign_page" class="campaign-page allocate-parts-page" xmlns:th="http://www.thymeleaf.org">
    <div class="app-layout">

        <div class="content-wrapper" id="innerContent">
            <div class="main-content-area">

                <div class="section-header">
                    <div>
                        <h2 class="page-title" th:text="#{campaign.manage.title}">Quản lý Chiến dịch</h2>
                    </div>
                </div>

                <div class="search-filter-bar card">
                    <div class="search-box-wrapper">
                        <div class="search-input-group">
                            <input type="text" id="searchInput" class="search-input" th:placeholder="#{campaign.search.placeholder}" th:aria-label="#{campaign.search.aria}"/>
                        </div>
                    </div>

                    <div class="action-group">
                        <select id="statusFilter" class="filter-select" th:aria-label="#{campaign.filter.aria}">
                            <option value="" th:text="#{campaign.filter.all}">Tất cả trạng thái</option>
                            <option value="Pending" th:text="#{status.pending_text}">Chờ duyệt (Pending)</option>
                            <option value="Active" th:text="#{status.active_text}">Đang chạy (Active)</option>
                            <option value="Completed" th:text="#{status.completed_text}">Hoàn thành (Completed)</option>
                            <option value="Rejected" th:text="#{status.rejected_text}">Từ chối (Rejected)</option>
                        </select>

                        <button type="button" id="btnCreateCampaign" class="btn-action btn-add">
                            <i class="fas fa-plus"></i> <span th:text="#{campaign.button.create}">Tạo chiến dịch</span>
                        </button>
                    </div>
                </div>

                <div class="card">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                            <tr>
                                <th class="text-left" th:text="#{table.header.id}">ID</th>
                                <th class="text-left" th:text="#{table.header.campaign_name}">Tên chiến dịch</th>
                                <th class="text-center" th:text="#{table.header.status}">Trạng thái</th>
                                <th class="text-center" th:text="#{table.header.start_date}">Ngày bắt đầu</th>
                                <th class="text-left" th:text="#{table.header.creator}">Người tạo</th>
                                <th class="text-right" th:text="#{table.header.action}">Hành động</th>
                            </tr>
                            </thead>
                            <tbody id="campaignsTableBody">
                            <tr>
                                <td colspan="6" class="no-data-cell">Đang tải dữ liệu...</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="card-footer">
                        <span class="pagination-info" id="paginationInfo" th:text="#{pagination.display_info}">Hiển thị 0 của 0</span>
                        <div class="pagination-wrapper">
                            <button class="btn-action btn-load" id="btnPrev" disabled th:text="#{button.previous}">« Trước</button>
                            <button class="btn-action btn-load" id="btnCurrent">1</button>
                            <button class="btn-action btn-load" id="btnNext" disabled th:text="#{button.next}">Sau »</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="campaignModal" class="modal" style="display:none;">
        <div class="modal-content campaign__modal-content">
            <div class="modal-header">
                <h3 id="campaignModalTitle" th:text="#{campaign.modal.create_title}">Tạo chiến dịch mới</h3>
                <button class="modal-close-btn" id="btnCancelModalHeader" th:aria-label="#{button.close}">×</button>
            </div>

            <div class="modal-body">
                <form id="campaignForm">
                    <div class="form-group">
                        <label for="campaignName" class="form-label" th:text="#{campaign.label.name}">Tên chiến dịch <span class="text-danger">*</span></label>
                        <input type="text" id="campaignName" class="form-control campaign__input" required th:placeholder="#{campaign.placeholder.name}" />
                    </div>

                    <div class="form-group">
                        <label for="campaignDescription" class="form-label" th:text="#{campaign.label.description}">Mô tả</label>
                        <textarea id="campaignDescription" class="form-control campaign__textarea" rows="3" th:placeholder="#{campaign.placeholder.description}"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="campaignStartDate" class="form-label" th:text="#{campaign.label.start_date}">Ngày bắt đầu <span class="text-danger">*</span></label>
                        <input type="date" id="campaignStartDate" class="form-control campaign__input" required />
                    </div>

                    <input type="hidden" id="campaignId" />

                    <div class="modal-footer-actions">
                        <button type="button" class="btn-action btn-cancel" id="btnCancelModal" th:text="#{button.cancel}">Hủy</button>
                        <button type="submit" class="btn-action btn-save" th:text="#{button.save_info}">Lưu thông tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="approveModal" class="modal" style="display:none;">
        <div class="modal-content campaign__modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3 id="approveModalTitle" th:text="#{campaign.modal.detail_title}">Chi tiết chiến dịch</h3>
                <button class="close-button" id="btnCloseApproveModal" th:aria-label="#{button.close}">×</button>
            </div>

            <div class="modal-body info-grid">
                <div class="info-item">
                    <span class="info-label" th:text="#{campaign.detail.id}">Mã chiến dịch:</span>
                    <span id="modalCampaignId" class="info-value font-monospace"></span>
                </div>
                <div class="info-item">
                    <span class="info-label" th:text="#{campaign.detail.name}">Tên chiến dịch:</span>
                    <span id="modalCampaignName" class="info-value highlight-text"></span>
                </div>
                <div class="info-item">
                    <span class="info-label" th:text="#{campaign.detail.start_date}">Ngày bắt đầu:</span>
                    <span id="modalCampaignStart" class="info-value"></span>
                </div>
                <div class="info-item">
                    <span class="info-label" th:text="#{campaign.detail.status}">Trạng thái:</span>
                    <span id="modalCampaignStatus" class="info-value"></span>
                </div>
                <div class="info-item full-width">
                    <span class="info-label" th:text="#{campaign.detail.description}">Mô tả:</span>
                    <p id="modalCampaignDesc" class="info-desc"></p>
                </div>
            </div>

            <div class="modal-footer-actions" id="approveModalActions">
            </div>
        </div>
    </div>
</section>
