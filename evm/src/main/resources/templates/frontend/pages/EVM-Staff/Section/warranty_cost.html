<section id="warranty_cost_page" class="warranty-cost-page allocate-parts-page" xmlns:th="http://www.thymeleaf.org">
    <div class="app-layout">
        <div class="content-wrapper" id="innerContent">
            <div class="main-content-area">

                <div class="section-header">
                    <div>
                        <h2 class="page-title" th:text="#{warranty.cost.title}">Chi phí bảo hành</h2>
                    </div>
                </div>

                <div class="card">

                    <div class="table-responsive">
                        <table class="data-table" id="warrantyCostTable">
                            <thead>
                            <tr>
                                <th class="text-left" th:text="#{table.header.claim_code}">Mã yêu cầu</th>
                                <th class="text-left" th:text="#{table.header.vehicle_code}">Mã xe</th>
                                <th class="text-left" th:text="#{table.header.requester}">Người yêu cầu</th>
                                <th class="text-center" th:text="#{table.header.request_date}">Ngày yêu cầu</th>
                                <th class="text-right" th:text="#{table.header.total_cost_vnd}">Tổng chi phí (VND)</th>
                                <th class="text-center" th:text="#{table.header.action}">Hành động</th>
                            </tr>
                            </thead>
                            <tbody id="warrantyCostTableBody">
                            </tbody>
                        </table>
                    </div>

                    <div class="card-footer">

                        <div class="grand-total-wrapper">
                            <span class="label" th:text="#{warranty.cost.grand_total_label}">Tổng chi phí toàn bộ:</span>
                            <span id="grandTotalCost" class="cost-value">0 VND</span>
                        </div>

                        <div class="pagination-wrapper">
                    <span class="pagination-info" th:text="#{pagination.display_info_of_tracking}">
                        Hiển thị <span id="pageInfo">0</span> của <span id="totalItems">0</span>
                    </span>
                            <div class="pagination-controls">
                                <button class="btn-action btn-load" id="prevPage" th:text="#{button.previous}">« Trước</button>
                                <button class="btn-action btn-load" id="currentPage">1</button>
                                <button class="btn-action btn-load" id="nextPage" th:text="#{button.next}">Sau »</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="modal" id="warrantyCostModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title" th:text="#{warranty.cost.modal.title}">Chi tiết chi phí <span id="modalClaimId" class="highlight-text"></span></h3>
                <button type="button" class="modal-close-btn warranty-cost__modal-close" th:aria-label="#{button.close}">×</button>
            </div>

            <div class="modal-body">
                <div class="table-responsive">
                    <table class="data-table modal-table">
                        <thead>
                        <tr>
                            <th class="text-left" th:text="#{table.header.part_service}">Phụ tùng</th>
                            <th class="text-center" th:text="#{table.header.quantity}">Số lượng</th>
                            <th class="text-right" th:text="#{table.header.unit_price_vnd}">Đơn giá (VND)</th>
                            <th class="text-right" th:text="#{table.header.subtotal_vnd}">Thành tiền (VND)</th>
                        </tr>
                        </thead>
                        <tbody id="modalCostBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
