<section class="campaign-management-page" xmlns:th="http://www.thymeleaf.org">
    <div class="app-layout">
        <div class="content-wrapper" id="innerContent">
            <div class="main-content-area">
                <h2 style="margin-bottom: 20px;" th:text="#{campaign.sc_staff.title}">Quản Lý Chiến Dịch Thu Hồi</h2>

                <div class="search-filter-bar">
                    <div class="search-box-wrapper">
                        <input type="text" id="searchCampaignBox" class="form-control search-input-with-icon"
                               th:placeholder="#{campaign.search.placeholder_short}" th:aria-label="#{campaign.search.aria}">
                    </div>
                </div>

                <div class="card filter-card">
                    <div class="filter-card-body">
                        <div class="filter-controls">
                            <select id="campaignStatusFilter" class="filter-select" th:aria-label="#{campaign.filter.aria}">
                                <option value="" th:text="#{campaign.filter.all}">Tất cả trạng thái</option>
                                <option value="planned" th:text="#{campaign.status.planned}">Đã lên kế hoạch</option>
                                <option value="active" th:text="#{campaign.status.active}">Đang hoạt động</option>
                                <option value="completed" th:text="#{campaign.status.completed}">Đã hoàn thành</option>
                            </select>
                            <input type="date" id="campaignDateFilter" class="filter-input" name="Date">
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-body-no-padding">
                            <table class="table-zebra table-full-width">
                                <thead>
                                <tr class="table-header-row">
                                    <th th:text="#{table.header.campaign_code}">Mã chiến dịch</th>
                                    <th th:text="#{table.header.campaign_name}">Tên chiến dịch</th>
                                    <th th:text="#{table.header.date}">Ngày</th>
                                    <th th:text="#{table.header.status}">Trạng thái</th>
                                    <th th:text="#{table.header.description}">Mô tả</th>
                                </tr>
                                </thead>
                                <tbody id="campaignsTbody">
                                </tbody>
                            </table>
                        </div>

                        <div class="card-footer" style="padding: 15px; border-top: 1px solid #eee;">
                            <div class="pagination-wrapper"
                                 style="display: flex; justify-content: space-between; align-items: center;">
                                <span class="pagination-info" id="paginationInfo" th:text="#{pagination.display_info}">Hiển thị 0 của 0</span>
                                <div>
                                    <button class="btn-action btn-load" id="prevPageBtn" th:text="#{button.previous}">« Trước</button>
                                    <span class="btn-action btn-load" id="currentPageSpan" style="margin: 0 10px;">1</span>
                                    <button class="btn-action btn-load" id="nextPageBtn" th:text="#{button.next}">Sau »</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </div>
</section>
