<section class="customer-record-management-page" xmlns:th="http://www.thymeleaf.org">
    <div class="app-layout">
        <div class="content-wrapper" id="innerContent">
            <div class="main-content-area">
                <div class="search-filter-bar">
                    <div class="search-box-wrapper">
                        <input type="text" id="searchCustomerBox" class="form-control search-input-with-icon"
                               th:placeholder="#{customer.search.placeholder}"
                               aria-label="Tìm kiếm..." />
                    </div>
                </div>

                <div class="card filter-card">
                    <div class="filter-card-body">
                        <div class="filter-controls">
                            <button type="button" id="btnMoFormCustomer" class="btn-action btn-add" th:text="#{customer.button.add}">
                                <i class="fas fa-plus"></i> Thêm Khách Hàng
                            </button>
                        </div>
                    </div>

                    <div class="card">
                        <table class="table-zebra table-full-width">
                            <thead>
                            <tr class="table-header-row">
                                <th th:text="#{table.header.customer_code}">Mã KH</th>
                                <th th:text="#{table.header.customer_name}">Tên khách hàng</th>
                                <th th:text="#{table.header.phone}">Số điện thoại</th>
                                <th th:text="#{table.header.email}">Email</th>
                                <th th:text="#{table.header.address}">Địa chỉ</th>
                                <th th:text="#{table.header.action}">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody id="customersTbody">
                            <tr>
                                <td colspan="6" class="table-placeholder-cell" th:text="#{customer.table.initial_data}">Dữ liệu sẽ được load từ database.</td>
                            </tr>
                            </tbody>
                        </table>
                        <div class="card-footer">
                            <div class="pagination-wrapper">
                                <span class="pagination-info" th:text="#{pagination.display_info}">Hiển thị 0 của 0</span>

                                <div class="d-flex justify-content-end align-items-center gap-2 mt-2">
                                    <button id="customerPrevBtn" class="btn-action btn-load" th:text="#{button.previous}">« Trước</button>
                                    <span id="customerPageNumber" class="btn-action btn-load">1</span>
                                    <button id="customerNextBtn" class="btn-action btn-load" th:text="#{button.next}">Sau »</button>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

                <div id="modalQuanLyCustomer" class="customer__modal" style="display:none;">
                    <div class="customer__modal-content">
                        <button class="close-button" th:aria-label="#{button.close}">&times;</button>
                        <h2 class="customer__modal-title" th:text="#{customer.modal.title}">Thông tin khách hàng</h2>
                        <form class="customer__form">
                            <div class="customer__form-group">
                                <label for="customer_code" class="customer__label" th:text="#{customer.label.code}">Mã khách hàng</label>
                                <input type="text" id="customer_code" name="customerCode" class="customer__input"
                                       readonly>
                            </div>
                            <div class="customer__form-group">
                                <label for="customer_name" class="customer__label" th:text="#{customer.label.name}">Tên khách hàng *</label>
                                <input type="text" id="customer_name" name="customerName" class="customer__input"
                                       required>
                            </div>
                            <div class="customer__form-group">
                                <label for="customer_phone" class="customer__label" th:text="#{table.header.phone}">Số điện thoại *</label>
                                <input type="tel" id="customer_phone" name="phone" class="customer__input" required>
                            </div>
                            <div class="customer__form-group">
                                <label for="customer_email" class="customer__label" th:text="#{table.header.email}">Email</label>
                                <input type="email" id="customer_email" name="email" class="customer__input">
                            </div>
                            <div class="customer__form-group">
                                <label for="customer_address" class="customer__label" th:text="#{table.header.address}">Địa chỉ</label>
                                <input id="customer_address" name="notes" class="customer__input"></input>
                            </div>

                            <div class="button-group">
                                <button type="button" id="customerCancelBtn"
                                        class="btn-action btn-cancel" th:text="#{button.cancel}">Hủy</button>
                                <button type="submit" id="customerSubmitBtn"
                                        class="btn-action btn-save" th:text="#{button.save}">Lưu</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
