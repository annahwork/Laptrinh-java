<section class="technician-assignment" xmlns:th="http://www.thymeleaf.org">
    <div class="app-layout">
        <div class="content-wrapper" id="innerContent">
            <div class="main-content-area">

                <div class="search-filter-bar">
                    <div class="search-box-wrapper">
                        <input type="text" id="searchBox" class="form-control search-input-with-icon"
                               th:placeholder="#{general.search.placeholder}" />
                    </div>
                </div>

                <div class="card filter-card">
                    <div class="filter-card-body">
                        <div class="filter-right">
                            <button id="btntechnician_assignment" class="btn-action btn-add" th:text="#{tech.assign.button.new_request}">
                                Tạo yêu cầu mới
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body-no-padding">
                    <table class="table-zebra table-full-width">
                        <thead>
                        <tr class="table-header-row">
                            <th th:text="#{table.header.request_code_short}">Mã Y/C</th>
                            <th th:text="#{table.header.license_vin}">Biển số / VIN</th>
                            <th th:text="#{table.header.date_created}">Ngày tạo</th>
                            <th th:text="#{table.header.technician}">Kỹ thuật viên</th>
                            <th th:text="#{table.header.action}">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="claimsTbody">
                        <tr id="placeholderRow">
                            <td colspan="5" class="table-placeholder-cell" th:text="#{tech.assign.table.initial_data}">
                                Dữ liệu sẽ được load từ database — chưa có dữ liệu ở môi trường hiện tại.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="card-footer">
                    <div class="pagination-wrapper">
                        <span class="pagination-info" th:text="#{pagination.display_info}">Hiển thị 0 của 0</span>
                        <div>
                            <button class="btn-action btn-load" th:text="#{button.previous}">« Trước</button>
                            <button class="btn-action btn-load">1</button>
                            <button class="btn-action btn-load" th:text="#{button.next}">Sau »</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="assignModal" class="modal modal-hidden" style="display:none;">
                <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="assignModalTitle"
                     tabindex="-1">
                    <div class="modal-header">
                        <h3 id="assignModalTitle" th:text="#{tech.assign.modal.assign_title}">Phân công Kỹ thuật viên</h3>
                        <span class="modal-close" id="assignModalClose" role="button" th:aria-label="#{button.close}">&times;</span>
                    </div>

                    <form id="assignForm">
                        <input type="hidden" id="assignClaimId" name="claimId">

                        <div class="modal-body">
                            <p class="modal-body-text" th:text="#{tech.assign.modal.request_label}">Yêu cầu: <strong id="assignClaimCode">CLM-0001</strong></p>

                            <div class="form-group">
                                <label class="form-label" th:text="#{tech.assign.label.select_tech}">Chọn Kỹ thuật viên</label>
                                <select id="techSelect" class="form-control modal-select-styled" required>
                                    <option value="" th:text="#{tech.assign.placeholder.select_tech}">-- Chọn kỹ thuật viên --</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" th:text="#{tech.assign.label.note}">Ghi chú (tuỳ chọn)</label>
                                <textarea id="assignNote" class="form-control" rows="3"
                                          th:placeholder="#{tech.assign.placeholder.note}"></textarea>
                            </div>

                            <div class="modal-footer-actions">
                                <button type="button" class="btn" id="assignCancelBtn" th:text="#{button.cancel}">Huỷ</button>
                                <button type="submit" class="btn btn-primary" th:text="#{button.save}">Lưu</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div id="modalYeuCauDieuPhoi" class="technician-assign__modal" style="display:none;">
                <div class="technician-assign__modal-content">
                    <button class="close-button" id="newReqCloseBtn" th:aria-label="#{button.close}">&times;</button>

                    <form class="technician-assign__form" id="newRequestForm">
                        <h2 class="technician-assign__title" th:text="#{tech.assign.modal.new_request_title}">Tạo yêu cầu điều phối mới</h2>

                        <div class="technician-assign__form-group">
                            <label for="assign_code" class="technician-assign__label" th:text="#{tech.assign.label.claim_id}">Mã yêu cầu (WarrantyClaim ID)</label>
                            <input type="text" id="assign_code" ... th:placeholder="#{tech.assign.placeholder.claim_id}">
                        </div>

                        <div class="technician-assign__form-group">
                            <label for="warranty_service" class="technician-assign__label" th:text="#{tech.assign.label.warranty_service}">Dịch vụ bảo hành</label>
                            <select id="warranty_service" class="technician-assign__select" required>
                                <option value="" th:text="#{tech.assign.placeholder.select_service}">-- Chọn dịch vụ --</option>
                            </select>
                        </div>

                        <div class="technician-assign__form-group">
                            <label for="technician_name" th:text="#{tech.assign.label.technician}">Kỹ thuật viên phụ trách</label>
                            <select id="technician_name" ... th:placeholder="#{tech.assign.placeholder.select_tech}">
                            </select>
                        </div>

                        <div class="technician-assign__form-group">
                            <label for="assign_desc" th:text="#{tech.assign.label.job_description}">Mô tả công việc</label>
                            <textarea id="assign_desc" ... th:placeholder="#{tech.assign.placeholder.job_description}"></textarea>
                        </div>

                        <div class="button-group">
                            <button type="button" id="assignCancelBtnModal"
                                    class="btn-action btn-cancel" th:text="#{button.cancel}">Huỷ</button>
                            <button type="submit"
                                    class="btn-action btn-save" th:text="#{button.create}">Tạo</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</section>
