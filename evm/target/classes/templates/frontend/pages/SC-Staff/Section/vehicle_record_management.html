<section class="vehicle-record-management-page" xmlns:th="http://www.thymeleaf.org">
  <div class="app-layout">
    <div class="content-wrapper" id="innerContent">
      <div class="main-content-area">
        <div class="search-filter-bar">
          <div class="search-box-wrapper">
            <input type="text" id="searchVehicleBox" class="form-control search-input-with-icon"
                   th:placeholder="#{vehicle.search.placeholder}">
          </div>
        </div>

        <div class="card filter-card">
          <div class="filter-controls">
            <select id="vehicleStatusFilter" class="filter-select">
              <option value="" th:text="#{vehicle.filter.all_status}">Tất cả trạng thái</option>
              <option value="active" th:text="#{vehicle.status.active}">Hoạt động</option>
              <option value="maintenance" th:text="#{vehicle.status.maintenance}">Bảo trì</option>
              <option value="inactive" th:text="#{vehicle.status.inactive}">Không hoạt động</option>
            </select>

            <input type="date" id="vehicleDateFilter" class="filter-input">

            <button type="button" id="btnMoFormVehicle" class="btn-action btn-add" th:text="#{vehicle.button.add}">
              <i class="fas fa-plus"></i> Thêm Hồ Sơ Xe
            </button>
          </div>

          <div class="card">
            <table class="table-zebra table-full-width">
              <thead>
              <tr class="table-header-row">
                <th th:text="#{table.header.plate_vin}">Biển số xe</th>
                <th th:text="#{table.header.customer_name}">Tên khách hàng</th>
                <th th:text="#{table.header.phone}">Số điện thoại</th>
                <th th:text="#{table.header.vehicle_type}">Loại xe</th>
                <th th:text="#{table.header.status}">Trạng thái</th>
                <th th:text="#{table.header.action}">Thao tác</th>
              </tr>
              </thead>
              <tbody id="vehiclesTbody">
              <tr>
                <td colspan="6" class="table-placeholder-cell" th:text="#{vehicle.table.initial_data}">Dữ liệu sẽ được load từ database.</td>
              </tr>
              </tbody>
            </table>
            <div class="card-footer">
              <div class="pagination-wrapper">
                <span class="pagination-info" th:text="#{pagination.display_info}">Hiển thị 0 của 0</span>
                <div class="d-flex justify-content-end align-items-center gap-2 mt-2">
                  <button id="vehiclePrevBtn" class="btn-action btn-load" th:text="#{button.previous}">« Trước</button>
                  <span id="vehiclePageNumber" class="btn-action btn-load">1</span>
                  <button id="vehicleNextBtn" class="btn-action btn-load" th:text="#{button.next}">Sau »</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="modalQuanLyVehicle" class="vehicle__modal" style="display:none;">
          <div class="vehicle__modal-content">
            <button class="close-button" th:aria-label="#{button.close}">&times;</button>
            <h2 class="vehicle__modal-title" th:text="#{vehicle.modal.title}">Thông tin hồ sơ xe</h2>
            <form class="vehicle__form">
              <div class="vehicle__form-group">
                <label for="vehicle_plate" class="vehicle__label" th:text="#{vehicle.label.plate}">Biển số xe *</label>
                <input type="text" id="vehicle_plate" name="vehiclePlate" class="vehicle__input" required>
              </div>
              <div class="vehicle__form-group">
                <label for="vehicle_customer" class="vehicle__label" th:text="#{vehicle.label.customer}">Tên khách hàng *</label>
                <input type="text" id="vehicle_customer" name="customerName" class="vehicle__input" required>
              </div>
              <div class="vehicle__form-group">
                <label for="vehicle_phone" class="vehicle__label" th:text="#{table.header.phone}">Số điện thoại</label>
                <input type="tel" id="vehicle_phone" name="phone" class="vehicle__input">
              </div>
              <div class="vehicle__form-group">
                <label for="vehicle_type" class="vehicle__label" th:text="#{table.header.vehicle_type}">Loại xe</label>
                <select id="vehicle_type" name="vehicleType" class="vehicle__select">
                  <option value="Toyota">Toyota</option>
                  <option value="Honda">Honda</option>
                  <option value="Mercedes-Benz">Mercedes-Benz</option>
                  <option value="BMW">BMW</option>
                </select>
              </div>
              <div class="vehicle__form-group">
                <label for="vehicle_status" class="vehicle__label" th:text="#{table.header.status}">Trạng thái</label>
                <select id="vehicle_status" name="status" class="vehicle__select">
                  <option value="active" th:text="#{vehicle.status.active}">Hoạt động</option>
                  <option value="maintenance" th:text="#{vehicle.status.maintenance}">Bảo trì</option>
                  <option value="inactive" th:text="#{vehicle.status.inactive}">Không hoạt động</option>
                </select>
              </div>
              <div class="vehicle__form-group">
                <label for="vehicle_notes" class="vehicle__label" th:text="#{vehicle.label.notes}">Ghi chú</label>
                <textarea id="vehicle_notes" name="notes" class="vehicle__textarea" rows="3"></textarea>
              </div>

              <div class="button-group">
                <button type="button" id="vehicleCancelBtn" class="btn-action btn-cancel" th:text="#{button.cancel}">Hủy</button>
                <button type="submit" id="vehicleSubmitBtn" class="btn-action btn-save" th:text="#{button.save}">Lưu</button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
